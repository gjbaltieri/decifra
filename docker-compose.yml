services:
  db:
    image: postgres:16-alpine
    container_name: decifra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decifra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decifra"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: decifra-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/decifra
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_decifra}

volumes:
  postgres_data: